[project]
name = "arbok"
version = "0.1.0"
description = "US residential real-estate predictor study at zip-code level"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "requests>=2.32",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "plotly>=6.7.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
notebook = ["jupyter>=1.0", "jupytext>=1.16", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbok"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.jupytext]
formats = "ipynb,py:percent"
