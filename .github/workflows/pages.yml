name: Deploy report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/processed/index.html"
      - "data/processed/methods.html"
      - "data/processed/zip_decile_map.html"
      - "data/processed/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp data/processed/index.html _site/index.html
          cp data/processed/methods.html _site/methods.html
          cp data/processed/zip_decile_map.html _site/zip_decile_map.html
          if [ -d data/processed/assets ]; then
            cp -R data/processed/assets _site/assets
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
